plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}
apply from: rootProject.file('gradletools.gradle')
repos()
version = '1.0'
group = 'com.github.mcjty'
base.archivesName = 'workspace-fabric'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
def includedMods = rootProject.subprojects.findAll { it != project }
includedMods.each { evaluationDependsOn(it.path) }
dependencies {
    mc()
    jei()
    top()
    includedMods.each { implementation project(it.path) }
}
loom {
    mods {
        includedMods.each { mod ->
            register(mod.findProperty('mod_id') ?: mod.name.toLowerCase()) {
                sourceSet mod.sourceSets.main
            }
        }
    }
    runs {
        configureEach {
            // Loom otherwise generates IDE configurations only for root projects.
            generateRunConfig = true
            appendProjectPathToDisplayName = false
        }
        client {
            client()
            displayName = 'Client'
            runDir 'runs/client'
        }
        server {
            server()
            displayName = 'Server'
            programArg '--nogui'
            runDir 'runs/server'
        }
    }
}
