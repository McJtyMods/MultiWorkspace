plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev'
}

apply from: rootProject.file('gradletools.gradle')
repos()
version = '1.0'
group = 'com.github.mcjty'
base.archivesName = 'workspace'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// This project coordinates runs and has no mod descriptor of its own.
subsystems.conventions.sourceSets.shouldMainSourceSetBeAutomaticallyAddedToRuns.set(false)

// Load every included mod from its local source checkout.
def mods = rootProject.subprojects.findAll { it != project }
mods.each { evaluationDependsOn(it.path) }

// FML otherwise finds both MOD_CLASSES and project dependency jars, preferring
// the jars over the source outputs. Keep the workspace's IDE classpath on sources.
def sourceModJars = files(mods.collect { mod -> mod.tasks.named('jar').flatMap { it.archiveFile } })
def workspaceRuntime = sourceSets.main.runtimeClasspath
sourceSets.main.runtimeClasspath = workspaceRuntime.filter { !sourceModJars.contains(it) }

runs {
    configureEach {
        workingDirectory = project.file('run')
        modSources.primary sourceSets.main
        mods.each { mod -> modSource mod.sourceSets.main }
    }
    client { }
    server { argument '--nogui' }
}

dependencies {
    mc()
    mcjtylib()
    jei()
    top()
    mods.each { mod -> implementation project(mod.path) }
}

// Run types must be configured first, but SDK interpolation must finish before
// NeoGradle captures the IntelliJ run arguments in its IDE import callbacks.
afterEvaluate {
    configurations.runtimeClasspath.resolve()
    extensions.getByName('runs').configureEach { run ->
        userDevRuntime.definitions.values().each { runtime -> runtime.configureRun(run) }
    }
}

// NeoGradle also adds each mod source set's runtime classpath to Gradle runs.
tasks.withType(JavaExec).configureEach {
    doFirst {
        classpath = classpath.filter { !sourceModJars.contains(it) }
    }
}
