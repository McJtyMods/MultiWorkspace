plugins {
    id 'java-library'
    id 'fabric-loom'
}
apply from: rootProject.file('gradletools.gradle')
repos()
version = '1.0'
group = 'com.github.mcjty'
base.archivesName = 'workspace-fabric'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
def includedMods = rootProject.subprojects.findAll { it != project }
includedMods.each { evaluationDependsOn(it.path) }
dependencies {
    mc()
    config()
    energy()
    jei()
    top()
    includedMods.each { implementation project(path: it.path, configuration: 'namedElements') }
}
loom {
    mods {
        includedMods.each { mod ->
            register(mod.findProperty('mod_id') ?: mod.name.toLowerCase()) {
                sourceSet mod.sourceSets.main
            }
        }
    }
    runs {
        configureEach {
            // Loom defaults to generating IDE configurations only for root projects.
            ideConfigGenerated = true
        }
        client {
            name 'Client'
            runDir 'runs/client'
        }
        server {
            name 'Server'
            runDir 'runs/server'
        }
    }
}

// Load all included source checkouts directly in the combined development runs.
tasks.withType(JavaExec).configureEach {
    def localJars = includedMods.collect { it.tasks.named('jar', Jar).get().archiveFile.get().asFile } as Set
    dependsOn tasks.named('classes'), includedMods.collect { it.tasks.named('classes') }
    def launchClasspath = files(classpath.files)
    classpath = launchClasspath.filter { it.exists() && !localJars.contains(it) } + files(includedMods.collect { it.sourceSets.main.output })
}
