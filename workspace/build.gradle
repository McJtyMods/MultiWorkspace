plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev'
}

apply from: rootProject.file('gradletools.gradle')
repos()
version = '1.0'
group = 'com.github.mcjty'
base.archivesName = 'workspace'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The library comes from Jenkins; loading its checkout too would duplicate its mod ID.
def mods = rootProject.subprojects.findAll { it != project && it.name != 'McJtyLib' }
mods.each { evaluationDependsOn(it.path) }

runs {
    configureEach {
        workingDirectory = project.file('run')
        mods.each { mod -> modSource mod.sourceSets.main }
    }
    client { }
    server { argument '--nogui' }
}

dependencies {
    mc()
    mcjtylib()
    jei()
    top()
    mods.each { mod -> implementation project(mod.path) }
}
