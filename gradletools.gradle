project.ext.set("rftoolsbase_version", '26.2-8.0.0-1')
project.ext.set("sereneseasons_version", '26.2-26.1.2.0.6')
// These integrations have no verified 26.2 release. Supply a version explicitly
// when one becomes available; never resolve their old 1.21/Forge artifacts.
ext.requireDependencyVersion = { name ->
    def value = project.findProperty(name)
    if (!value) {
        throw new GradleException("No Minecraft 26.2 release configured for ${name}; set -P${name}=<compatible version>")
    }
    value
}

ext.getChangelogText =  {
    def changelogFile = file('changelog.txt')
    StringBuilder str = new StringBuilder()
    int lineCount = 0
    boolean done = false
    changelogFile.eachLine {
        if (done || it == null) {
            return
        }
        if (it.size() > 1) {
            def temp = it
            if (lineCount == 0) {
                temp = "${mod_name} ${version}"
                temp = "## $temp"
            } else if (!it.startsWith('-')) {
                temp = "#### $temp"
            } else {
                temp = temp.replaceAll("(\\S+\\/\\S+)#([0-9]+)\\b", "[\$0](https://github.com/\$1/issues/\$2)")
                temp = temp.replaceAll("#([0-9]+)\\b", "[\$0](https://github.com/$github_project/issues/\$1)")
            }
            str.append(temp).append('\n')
            lineCount++
            return
        } else {
            done = true
        }
    }
    return str.toString()
}

