pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.firstdark.dev/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = '26.2_fabric'

// Include available checkouts. Both nested and sibling *_fabric layouts work.
def mods = ['McJtyLib', 'TheOneProbe', 'LostCities', 'LostSouls', 'InControl',
            'Nice', 'MeeCreeps', 'InteractionWheel', 'Restrictions', 'SignTastic', 'Radar',
            'DeepResonance', 'RFToolsBase', 'RFToolsStorage', 'RFToolsControl',
            'RFToolsDimensions', 'RFToolsPower', 'RFToolsUtility', 'RFToolsBuilder',
            'Trinkets', 'ModXNet', 'NEW']
mods.each { mod ->
    def configured = providers.gradleProperty("mod.${mod}").orNull
    def candidates = configured ? [file(configured)] : [file(mod), file("../${mod}_fabric")]
    def checkout = candidates.find {
        new File(it, 'build.gradle').isFile()
    }
    if (checkout != null) {
        include mod
        project(":${mod}").projectDir = checkout
    }
}
include 'workspace'
